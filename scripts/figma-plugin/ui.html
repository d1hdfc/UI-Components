<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two-Way Auto-Sync</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #333;
      background: #fafafa;
      font-size: 13px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 12px;
      font-weight: 500;
    }
    .badge-connected {
      background: #e6f4ea;
      color: #137333;
    }
    .badge-disconnected {
      background: #fce8e6;
      color: #c5221f;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: #0c2340;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
      margin-top: 6px;
    }
    .btn:hover {
      background: #1d4076;
    }
    .btn-secondary {
      background: #fff;
      color: #0c2340;
      border: 1px solid #d1d5db;
    }
    .btn-secondary:hover {
      background: #f3f4f6;
    }
    .log-box {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h2>
    Two-Way Auto-Sync
    <span id="statusBadge" class="badge badge-disconnected">Disconnected</span>
  </h2>

  <div class="card">
    <div style="font-size: 12px; color: #666; margin-bottom: 8px;">
      Connected to Local Sync Server: <b>ws://localhost:3055</b>
    </div>
    <button id="syncNowBtn" class="btn">Push Selection to Code</button>
    <button id="reconnectBtn" class="btn btn-secondary">Reconnect Bridge</button>
  </div>

  <div style="font-weight: 600; margin-bottom: 6px; font-size: 12px;">Sync Activity Log</div>
  <div id="logBox" class="log-box">Initializing Figma bridge...</div>

  <script>
    const statusBadge = document.getElementById('statusBadge');
    const logBox = document.getElementById('logBox');
    const syncNowBtn = document.getElementById('syncNowBtn');
    const reconnectBtn = document.getElementById('reconnectBtn');

    let socket = null;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logBox.textContent = `[${time}] ${msg}\n` + logBox.textContent;
    }

    function connect() {
      log('Connecting to WebSocket ws://localhost:3055...');
      statusBadge.className = 'badge badge-disconnected';
      statusBadge.textContent = 'Connecting...';

      try {
        socket = new WebSocket('ws://localhost:3055');

        socket.onopen = () => {
          statusBadge.className = 'badge badge-connected';
          statusBadge.textContent = 'Live Connected';
          log('Connected to sync server!');
          socket.send(JSON.stringify({ type: 'join', channel: 'figma-sync' }));
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'broadcast' && data.message) {
              const payload = data.message;
              if (payload.event === 'CODE_TO_FIGMA_DELETE') {
                log(`Received code deletion for: ${payload.componentName || payload.nodeId}`);
                parent.postMessage({
                  pluginMessage: {
                    type: 'ACTION_DELETE_COMPONENT',
                    payload
                  }
                }, '*');
              } else if (payload.event === 'CODE_TO_FIGMA_UPDATE') {
                log(`Received code update for: ${payload.componentName}`);
                parent.postMessage({
                  pluginMessage: {
                    type: 'ACTION_UPDATE_COMPONENT',
                    payload
                  }
                }, '*');
              }
            } else if (data.type === 'system') {
              log(`System: ${data.message}`);
            }
          } catch (e) {
            log('Error parsing socket message');
          }
        };

        socket.onclose = () => {
          statusBadge.className = 'badge badge-disconnected';
          statusBadge.textContent = 'Disconnected';
          log('Socket connection closed. Retrying in 5s...');
          setTimeout(connect, 5000);
        };

        socket.onerror = () => {
          statusBadge.className = 'badge badge-disconnected';
          statusBadge.textContent = 'Error';
        };
      } catch (err) {
        log(`Socket error: ${err.message}`);
        setTimeout(connect, 5000);
      }
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'LOG') {
        log(msg.message);
      } else if (msg.type === 'SELECTION_CAPTURED') {
        log(`Selection captured: ${msg.payload.length} items`);
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: 'message',
            channel: 'figma-sync',
            message: {
              event: 'FIGMA_SELECTION_PUSH',
              items: msg.payload
            }
          }));
        }
      }
    };

    syncNowBtn.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'CAPTURE_SELECTION' } }, '*');
    };

    reconnectBtn.onclick = () => {
      if (socket) socket.close();
      connect();
    };

    connect();
  </script>
</body>
</html>
